<html lang="ja" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MOON CORE ARCHIVE | 未来世界 公式設定資料集</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@500;600;700&family=Noto+Sans+JP:wght@400;500;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<link rel="icon" href="/assets/mooncore.svg" type="image/svg+xml">

<body>

<!-- 背景 -->
<div class="bg-canvas" aria-hidden="true">

    <!-- 背景色 -->
    <div class="bg-color-layer"></div>

    <!-- グリッド -->
    <svg class="bg-grid" viewBox="0 0 1000 1000" preserveAspectRatio="xMidYMid slice">
        <defs>
            <pattern id="bgGridPattern" width="48" height="48" patternUnits="userSpaceOnUse">
                <path d="M48 0H0V48"
                      fill="none"
                      stroke="currentColor"
                      stroke-width="0.6"/>
            </pattern>
        </defs>

        <rect width="1000"
              height="1000"
              fill="url(#bgGridPattern)"/>
    </svg>

    <!-- リング -->
    <svg class="bg-rings" viewBox="0 0 1000 1000" preserveAspectRatio="xMidYMid slice">
        <circle cx="860" cy="140" r="220"/>
        <circle cx="860" cy="140" r="320"/>
        <circle cx="860" cy="140" r="420"/>

        <circle cx="120" cy="920" r="160"/>
        <circle cx="120" cy="920" r="240"/>
    </svg>

    <!-- 巨大背景アイコン -->
    <div id="bg-icon" class="bg-icon"></div>

</div>

<header class="site-header">
    <div class="header-inner">

        <a class="brand" href="#/">
            <img
                class="brand-logo-img"
                src="assets/mooncore.svg"
                alt="MOON CORE">

            <div class="brand-text">
                <span class="brand-eyebrow">
                    未来世界 ARCHIVE
                </span>

                <span class="brand-title">
                    MOON CORE
                </span>
            </div>
        </a>

        <nav class="main-nav" id="main-nav"></nav>

        <div class="header-actions">

            <button
                class="icon-btn"
                aria-label="検索"
                onclick="openSearch()">

                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
                    <circle cx="11" cy="11" r="7"/>
                    <line x1="21" y1="21" x2="16.4" y2="16.4"/>
                </svg>

            </button>

            <button
                class="icon-btn"
                aria-label="テーマ切替"
                onclick="toggleTheme()">

                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
                    <circle cx="12" cy="12" r="4.5"/>
                    <path d="M12 2v2.4M12 19.6V22M4.9 4.9l1.7 1.7M17.4 17.4l1.7 1.7M2 12h2.4M19.6 12H22M4.9 19.1l1.7-1.7M17.4 6.6l1.7-1.7"/>
                </svg>

            </button>

        </div>

    </div>
</header>



<div
    class="search-overlay"
    id="search-overlay"
    onclick="if(event.target===this)closeSearch()">

    <div class="search-panel">

        <div class="search-input-row">

            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
                <circle cx="11" cy="11" r="7"/>
                <line x1="21" y1="21" x2="16.4" y2="16.4"/>
            </svg>

            <input
                id="search-input"
                type="text"
                placeholder="用語・鉱物・技術を検索…"
                autocomplete="off"
                oninput="runSearch(this.value)">

            <span class="esc" onclick="closeSearch()">ESC</span>

        </div>

        <div id="search-results" class="search-results"></div>

    </div>

</div>



<div id="toast" class="toast"></div>



<div id="home-hero">
    <section class="hero">

        <svg class="hero-rings" viewBox="0 0 400 400">
            <circle cx="200" cy="200" r="190"/>
            <circle cx="200" cy="200" r="150"/>
            <circle cx="200" cy="200" r="110"/>
            <circle cx="200" cy="200" r="70"/>
        </svg>

        <div class="hero-inner fade-seq">

            <!-- ロゴ -->
            <img
                class="hero-logo"
                src="assets/mooncore3.svg"
                alt="MOON CORE"
                id="hero-logo"
            >

            <!-- サブタイトル -->
            <div class="hero-eyebrow">
                <span class="dot"></span>
                公式設定資料集・全文検索可能
            </div>

            <!-- 世界観 -->
            <p class="hero-quote">
                「この世界は理想郷でも、終末世界でもない。<br>
                便利になったからこそ、新たな問題を抱えた人類の未来。<br>
                それが、この『未来世界』である。」
            </p>

            <!-- 資料集の説明 -->
            <p class="hero-desc">
                本資料集は未来世界の文明・国家・技術・文化などをまとめた公式設定資料集です。
            </p>

            <!-- ナビゲーション -->
            <div class="hero-cta">

                <a
                    class="btn btn-primary"
                    href="#/article/world-overview"
                >
                    「未来世界」とはを読む
                </a>

                <a
                    class="btn btn-ghost"
                    href="#"
                    onclick="event.preventDefault();openSearch();"
                >
                    資料集を検索する
                </a>

                <a
                    class="btn btn-ghost"
                    href="#/articles"
                >
                    全記事一覧
                </a>

            </div>

        </div>

    </section>
</div>



<main id="app"></main>

<footer>
    MOON CORE ARCHIVE — 未来世界 公式設定資料集 /
    本サイトはフィクション作品「未来世界」の設定資料集です
