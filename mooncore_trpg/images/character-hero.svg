<svg viewBox="0 0 480 240" xmlns="http://www.w3.org/2000/svg" font-family="'Noto Sans JP','Yu Gothic',sans-serif">
  <!-- connecting lines from badge to stat nodes -->
  <g stroke="#3fcbd1" stroke-width="1.5" opacity="0.55">
    <line x1="240" y1="120" x2="240" y2="42"/>
    <line x1="240" y1="120" x2="152" y2="76"/>
    <line x1="240" y1="120" x2="328" y2="76"/>
    <line x1="240" y1="120" x2="176" y2="182"/>
    <line x1="240" y1="120" x2="304" y2="182"/>
  </g>

  <!-- central hex badge -->
  <polygon points="240,58 292,88 292,148 240,178 188,148 188,88" fill="#14213d"/>
  <polygon points="240,58 292,88 292,148 240,178 188,148 188,88" fill="none" stroke="#3fcbd1" stroke-width="3"/>
  <!-- silhouette -->
  <circle cx="240" cy="103" r="16" fill="#edf5fb"/>
  <path d="M212,150 Q240,122 268,150 L268,158 Q240,144 212,158 Z" fill="#edf5fb"/>

  <!-- stat nodes -->
  <g font-size="13" font-weight="700" text-anchor="middle">
    <circle cx="240" cy="34" r="20" fill="#246bce"/>
    <text x="240" y="39" fill="#fff">STR</text>

    <circle cx="140" cy="68" r="20" fill="#246bce"/>
    <text x="140" y="73" fill="#fff">DEX</text>

    <circle cx="340" cy="68" r="20" fill="#246bce"/>
    <text x="340" y="73" fill="#fff">CON</text>

    <circle cx="160" cy="196" r="20" fill="#246bce"/>
    <text x="160" y="201" fill="#fff">INT</text>

    <circle cx="320" cy="196" r="20" fill="#246bce"/>
    <text x="320" y="201" fill="#fff">POW</text>
  </g>

  <!-- dice -->
  <g transform="translate(48,150)">
    <rect x="0" y="0" width="46" height="46" rx="7" fill="#fff" stroke="#c8d7e6" stroke-width="2"/>
    <circle cx="15" cy="15" r="4" fill="#14213d"/>
    <circle cx="31" cy="15" r="4" fill="#14213d"/>
    <circle cx="15" cy="31" r="4" fill="#14213d"/>
    <circle cx="31" cy="31" r="4" fill="#14213d"/>
    <text x="23" y="66" font-size="13" font-weight="700" fill="#14213d" text-anchor="middle">5D4</text>
  </g>

  <g transform="translate(386,150)">
    <rect x="0" y="0" width="46" height="46" rx="23" fill="#fff" stroke="#c8d7e6" stroke-width="2"/>
    <text x="23" y="30" font-size="18" font-weight="800" fill="#14213d" text-anchor="middle">99</text>
    <text x="23" y="66" font-size="13" font-weight="700" fill="#14213d" text-anchor="middle">技能上限</text>
  </g>
</svg>
