    <rect x="205" y="60" width="70" height="140" fill="#14213d"/>
    <rect x="225" y="30" width="30" height="34" fill="#14213d"/>
    <g fill="#3fcbd1">
      <rect x="215" y="74" width="10" height="10"/>
      <rect x="235" y="74" width="10" height="10"/>
      <rect x="255" y="74" width="10" height="10"/>
      <rect x="215" y="94" width="10" height="10"/>
