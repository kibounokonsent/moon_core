    </g>
    <g transform="translate(240,42)">
      <rect x="30" y="14" width="70" height="30" rx="4" fill="#edf5fb" stroke="#c8d7e6"/>
      <text x="65" y="34" fill="#14213d">COM</text>
      <path d="M104,29 h34" stroke="#3fcbd1" stroke-width="2.5" marker-end="url(#arrow)"/>
