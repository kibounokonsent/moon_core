<svg viewBox="0 0 480 260" xmlns="http://www.w3.org/2000/svg" font-family="'Noto Sans JP','Yu Gothic',sans-serif">
  <g font-size="13" font-weight="800" text-anchor="middle">
    <!-- row template repeated -->
    <g transform="translate(0,0)">
      <rect x="30" y="14" width="70" height="30" rx="4" fill="#edf5fb" stroke="#c8d7e6"/>
      <text x="65" y="34" fill="#14213d">RSH</text>
      <path d="M104,29 h34" stroke="#3fcbd1" stroke-width="2.5" marker-end="url(#arrow)"/>
      <rect x="142" y="12" width="80" height="34" rx="4" fill="#14213d"/>
      <text x="182" y="34" fill="#3fcbd1">ARC 知恵</text>
    </g>
    <g transform="translate(0,42)">
      <rect x="30" y="14" width="70" height="30" rx="4" fill="#edf5fb" stroke="#c8d7e6"/>
      <text x="65" y="34" fill="#14213d">TAC</text>
      <path d="M104,29 h34" stroke="#3fcbd1" stroke-width="2.5" marker-end="url(#arrow)"/>
      <rect x="142" y="12" width="80" height="34" rx="4" fill="#14213d"/>
      <text x="182" y="34" fill="#3fcbd1">WAR 軍事</text>
    </g>
    <g transform="translate(0,84)">
      <rect x="30" y="14" width="70" height="30" rx="4" fill="#edf5fb" stroke="#c8d7e6"/>
      <text x="65" y="34" fill="#14213d">ENG</text>
      <path d="M104,29 h34" stroke="#3fcbd1" stroke-width="2.5" marker-end="url(#arrow)"/>
      <rect x="142" y="12" width="80" height="34" rx="4" fill="#14213d"/>
      <text x="182" y="34" fill="#3fcbd1">SYS 文明</text>
    </g>
    <g transform="translate(0,126)">
      <rect x="30" y="14" width="70" height="30" rx="4" fill="#edf5fb" stroke="#c8d7e6"/>
      <text x="65" y="34" fill="#14213d">MED</text>
      <path d="M104,29 h34" stroke="#3fcbd1" stroke-width="2.5" marker-end="url(#arrow)"/>
      <rect x="142" y="12" width="80" height="34" rx="4" fill="#14213d"/>
      <text x="182" y="34" fill="#3fcbd1">LIF 生命</text>
    </g>

    <!-- second column -->
    <g transform="translate(240,0)">
      <rect x="30" y="14" width="70" height="30" rx="4" fill="#edf5fb" stroke="#c8d7e6"/>
      <text x="65" y="34" fill="#14213d">OPS</text>
      <path d="M104,29 h34" stroke="#3fcbd1" stroke-width="2.5" marker-end="url(#arrow)"/>
      <rect x="142" y="12" width="80" height="34" rx="4" fill="#14213d"/>
